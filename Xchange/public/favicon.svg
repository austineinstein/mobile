<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Shopping Bag for Store/Product -->
  <defs>
    <style>
      .bag-main { fill: #FF6B6B; }
      .bag-handle { stroke: #FF6B6B; stroke-width: 2; fill: none; stroke-linecap: round; }
      .bag-highlight { fill: #FFE66D; }
    </style>
  </defs>
  
  <!-- Bag body -->
  <rect class="bag-main" x="16" y="20" width="32" height="36" rx="2" ry="2"/>
  
  <!-- Bag highlight/shine -->
  <ellipse class="bag-highlight" cx="28" cy="28" rx="6" ry="8" opacity="0.3"/>
  
  <!-- Bag handles -->
  <path class="bag-handle" d="M 22 20 Q 22 10, 32 8 Q 42 10, 42 20"/>
  
  <!-- Top fold line -->
  <line x1="16" y1="20" x2="48" y2="20" stroke="#FF5252" stroke-width="1" opacity="0.5"/>
</svg>